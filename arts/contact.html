        <section>
            <div class="section">
                <div class="container" style="max-width:600px;">
                    <!--
                        This form has no backend yet. Easiest free option on GitHub
                        Pages: sign up at https://formspree.io, get a form endpoint,
                        and replace the action="..." below with it.
                    -->
                    <form action="https://formspree.io/f/yourFormId" method="POST" style="display:flex; flex-direction:column; gap:1rem;">
                        <input type="text" name="name" placeholder="Your name" required
                               style="padding:0.75rem; border-radius:6px; border:1px solid rgba(255,255,255,0.3); background:rgba(255,255,255,0.05); color:white;">
                        <input type="email" name="email" placeholder="Your email" required
                               style="padding:0.75rem; border-radius:6px; border:1px solid rgba(255,255,255,0.3); background:rgba(255,255,255,0.05); color:white;">
                        <textarea name="message" placeholder="Your message" rows="5" required
                               style="padding:0.75rem; border-radius:6px; border:1px solid rgba(255,255,255,0.3); background:rgba(255,255,255,0.05); color:white;"></textarea>
                        <button type="submit" class="btn" style="align-self:flex-start;">Send Message</button>
                    </form>
                    <p style="color:rgba(255,255,255,0.7); margin-top:2rem; text-align:center;">
                        Or reach me directly at
                        <a href="mailto:youremail@example.com" style="color:var(--hover-button);">youremail@example.com</a>
